model = "k3-256k"
model_provider = "kimi-anthropic"
model_catalog_json = "~/.codex/kimi-anthropic-models.json"
model_reasoning_effort = "max"
service_tier = "default"    # 显式无 tier：覆盖基础 config 的 fast，第三方模型不支持 tier 也不再警告

[features]
memories = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-used", "context-window-size", "run-state"]
status_line_use_colors = true

[model_providers.kimi-anthropic]
name = "kimi-anthropic"
env_base_url = "KIMI_ANTHROPIC_BASE_URL"
env_key = "KIMI_API_KEY"
wire_api = "anthropic"
requires_openai_auth = false
request_max_retries = 99
request_max_retry_delay_ms = 60000

[projects."/Users/yuguorui/Code/RSSBabel"]
trust_level = "trusted"

[projects."/Users/yuguorui/Downloads"]
trust_level = "trusted"
