model_provider = "deepseek-resp"
model = "deepseek-flash"
model_catalog_json = "~/.codex/deepseek-resp-models.json"
model_reasoning_effort = "max"
show_raw_agent_reasoning = true
web_search = "disabled"    # DeepSeek Responses API 忽略内置 web_search；搜索统一走全局 deepseek-search MCP

sandbox_mode = "workspace-write"
service_tier = "default"    # 第三方模型不支持 service tier：显式 default，避免继承 fast 的告警
approvals_reviewer = "auto_review"

[agents]
max_threads = 1000000

[sandbox_workspace_write]
network_access = true

[model_providers.deepseek-resp]
name = "DeepSeek Responses"
base_url = "https://api.deepseek.com"
env_base_url = "DEEPSEEK_RESP_BASE_URL"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-used", "context-window-size", "run-state", "fast-mode"]
status_line_use_colors = true
session_picker_view = "comfortable"
pet = "bongo-cat"
mouse_scroll_speed = 3.0

[tui.presets.1]
input = """
为了人类阅读体验，尽量把跨越屏幕长度的长句拆分为 “-” （unordered item） 分割的，表递进关系的短句序列。
需要保证结论性的句子锁进级别较低，然后跟上补充性的锁进级别更多的句子。"""
label = ""

[tui.presets.2]
input = '不要用→，而是尽量使用更自然的符号，这个不是人能打出的字符，如"/"，"->" 等'
label = ""

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
conversationDetailMode = "STEPS_COMMANDS"

[features]
apps = false
js_repl = false
memories = true
# multi_agent = true
# multi_agent_v2 = false
workflows = true

[mcp_servers.browsermcp]
command = "npx"
args = ["@browsermcp/mcp@latest"]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"
{{ if ne .chezmoi.username "yuguorui" }}
# 内网 IQS 网关（internal-support.sec-gateway-higress.aliyuncs.com）的 search / readpage MCP（仅工作账号启用）。
[mcp_servers.websearch]
url = "https://internal-support.sec-gateway-higress.aliyuncs.com/iqs-mcp/mcp-servers/iqs-mcp-server-search"
bearer_token_env_var = "IQS_API_KEY"

[mcp_servers.webfetch]
url = "https://internal-support.sec-gateway-higress.aliyuncs.com/iqs-mcp/mcp-servers/iqs-mcp-server-readpage"
bearer_token_env_var = "IQS_API_KEY"
{{ end }}
# DeepSeek 官方 Search/Fetch API（https://api-docs.deepseek.com/zh-cn/guides/search）
# 原生 JSON API 不是 MCP；本地 stdio 适配器暴露 search / fetch 工具。
# Codex 会清理 stdio MCP 子进程环境，因此显式转发 DEEPSEEK_API_KEY。
[mcp_servers.deepseek-search]
env_vars = ["DEEPSEEK_API_KEY"]
command = "python3"
args = ["{{ .chezmoi.homeDir }}/.codex/tools/deepseek-search-mcp.py"]
startup_timeout_sec = 60

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true
